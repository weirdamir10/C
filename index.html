const SUM={1:[
['١) العناصر الانتقالية','عناصر الفئة d يتتابع فيها امتلاء المستوى الفرعي d (d¹⁻¹⁰) في 4 سلاسل، و10 أعمدة رأسية، و8 مجموعات (VIII تضم 3 أعمدة). السلسلة الأولى Sc→Zn. العنصر الانتقالي: d غير تام الامتلاء في الذرة أو في إحدى حالات تأكسده، لذا Zn وCd وHg (2B) غير انتقالية بينما Cu وAg وAu (1B) انتقالية. المجموعة = مجموع إلكترونات s+d؛ والدورة من رقم 4s.'],
['٢) حالات التأكسد','تزداد من Sc (+3) حتى Mn (+7) ثم تقل حتى Zn (+2) لتقارب طاقتي 4s و3d. تفقد إلكترونات 4s أولاً. أكثر التراكيب استقراراً d⁰ وd⁵ وd¹⁰، لذلك Fe³⁺ أكثر استقراراً من Fe²⁺ وMn²⁺ أكثر استقراراً من Mn³⁺. جهد التأين يزداد بنقص نصف القطر، والقفزة الكبيرة تدل على كسر مستوى مكتمل.'],
['٣) الخواص العامة','بزيادة العدد الذري: تزداد الكتلة الذرية (Ni يشذ) والكثافة وشحنة النواة الفعالة، ويقل نصف القطر حتى Cr ثم يثبت نسبياً حتى Cu ثم يزداد في Zn، ويقل النشاط الكيميائي. الرابطة الفلزية قوية لاشتراك 3d و4s فترتفع درجتا الانصهار والغليان. البارامغناطيسية لوجود إلكترونات مفردة والدايامغناطيسية لعدمها، والعزم = √n(n+2). تصلح عوامل حفز لتعدد التأكسد وتكوين روابط مع المتفاعلات.'],
['٤) فلز الحديد','5.1% من القشرة؛ الرابع عنصراً والأول انتقالياً. الخامات: هيماتيت Fe₂O₃، ليمونيت 2Fe₂O₃·3H₂O، ماجنتيت Fe₃O₄، سيدريت FeCO₃. التجهيز: تكسير، تلبيد، تركيز (فيزيائي)، تحميص (كيميائي). الاختزال: الفرن العالي (CO من الكوك) أو ميدركس (CO+H₂). السبائك: بينية (Fe–C)، استبدالية (Fe–Cr)، بينفلزية (Fe₃C).'],
['٥) أكاسيد الحديد','FeO أسود (تسخين FeCO₃ أو FeC₂O₄ بمعزل عن الهواء)، Fe₂O₃ أحمر (Fe(OH)₃ فوق 200°C أو تسخين FeSO₄)، Fe₃O₄ مغناطيسي مختلط. اختزال Fe₂O₃: 230–300°C → Fe₃O₄، 400–700°C → FeO، فوق 700°C → Fe. أكسدة أي أكسيد حديد تعطي Fe₂O₃.']],
2:[
['١) مجموعة HCl المخفف','القاعدة: الحمض الأكثر ثباتاً (الأقل تطايراً) يطرد أنيون الحمض الأقل ثباتاً من ملحه الصلب. تكشف عن CO₃²⁻ وHCO₃⁻ وS²⁻ وSO₃²⁻ وS₂O₃²⁻ وNO₂⁻ بغازاتها المميزة. التجربة الأساسية بملح صلب، والتأكيدية بمحلول الملح.'],
['٢) مجموعة H₂SO₄ المركز','تكشف عن Cl⁻ (HCl عديم اللون) وBr⁻ (أبخرة بنية) وI⁻ (أبخرة بنفسجية) وNO₃⁻ (الحلقة البنية). تأكيدية AgNO₃: AgCl أبيض يذوب في النشادر، AgBr أصفر باهت يذوب ببطء، AgI أصفر لا يذوب. مجموعة BaCl₂: SO₄²⁻ وPO₄³⁻ (فوسفات الباريوم يذوب في HCl).'],
['٣) الكشف عن الكاتيونات','Cu²⁺: H₂S/HCl المخفف → CuS أسود. المجموعة الثالثة (Fe²⁺، Fe³⁺، Al³⁺) بـ NH₄OH: Fe(OH)₂ أبيض مخضر يبنّي في الهواء، Fe(OH)₃ بني محمر، Al(OH)₃ أبيض جيلاتيني. وفرة NaOH تذيب Al(OH)₃ فقط. Ca²⁺: (NH₄)₂CO₃ → CaCO₃ أبيض، ولهب أحمر طوبي.'],
['٤) المعايرة','تقدير تركيز مجهول بحجم معلوم من محلول قياسي (سحاحة). قانون المعايرة: Ma·Va/na = Mb·Vb/nb حيث n معامل المادة في المعادلة الموزونة. المولارية = عدد المولات ÷ الحجم باللتر. الكاشف يحدد نقطة النهاية: عباد الشمس، أزرق بروموثيمول، ميثيل برتقالي، فينولفثالين.'],
['٥) التطاير والترسيب','تحليل كمي وزني. التطاير: تسخين المتهدرت وكتلة ماء التبلر = الفرق في الكتلة (مثال BaCl₂·xH₂O: x = 2). الترسيب: ترسيب المادة بمركب غير ذائب، ترشيح بورق عديم الرماد، حرق في بوتقة، ثم الحساب من المعادلة الموزونة. النسبة % = كتلة المادة × 100 ÷ كتلة العينة.']]};

dq('b5',line([0,1.17,2.33,3.5,3.5,3.5],['','','','','',''],[[3,5,'ثابتة']]),'أضيف BaCl₂ تدريجياً إلى Na₂SO₄: لماذا تثبت كتلة BaSO₄؟','لأن كل Na₂SO₄ ترسب (الباقي BaCl₂ زائد)',['لأن BaSO₄ ذاب','لأن الراسب تبخر','لأن BaCl₂ نفد'],'عند اكتمال الترسيب لا يتكوّن راسب إضافي.',['ppt','stoich']);
BANK.forEach(q=>{const m=q.t.match(/^ناتج التفاعل: (.*?)(?: \(([^()]*)\))?$/);if(m){q.eq=[m[1],m[2]||''];q.t='ما ناتج التفاعل الآتي؟'}});
const MM={1:['a1','a1','a1','a3','a2','a2','a5','a4','a4','a4'],2:['b1','b1','b1','b1','b2','b3','b4','b5']},SM={1:['a1','a2','a3','a5','a3'],2:['b1','b4','b5','b5']},TABS=[['sum','ملخص'],['mis','أخطاء'],['dg','رسوم'],['qs','أسئلة'],['rl','ترابط'],['tl','أدوات']];
const ids=c=>Object.keys(LN).filter(k=>k[0]==(c==1?'a':'b')),cnt=l=>{const a=BANK.filter(q=>q.l==l),d=a.filter(q=>q.s).length;return[a.length,d,a.filter(q=>RES[q.id]===1).length]};
function nav(){$('#nv').innerHTML=`<a class='br' href='#home'>⚗ كيمياء 3ث</a><a href='#home'>الدروس</a><a href='#cn'>خريطة الترابط</a><a href='#wrong'>أخطائي (${BANK.filter(q=>RES[q.id]===0).length})</a>`}
function memo(l){const c={};BANK.filter(q=>q.l==l).forEach(q=>q.tg.forEach(t=>c[t]=(c[t]||0)+1));return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([t])=>`<p><b>${CON[t][0]}:</b> ${fx(CON[t][1])} <button data-tag='${t}'>تدرّب ↔ دروس أخرى</button></p>`).join('')}
function card(q){const e=q.eq?`<div class='eqn'>${fx(q.eq[0])} <span class='arr'><small>${fx(q.eq[1])}</small>→</span> ؟</div>`:'';return `<div class='c qc' data-b='${q.id}'><span class='w'>${LN[q.l]}</span><p class='qt'>${fx(q.t)}</p>${q.s?`<div class='fig'>${q.s}</div>`:''}${e}<div class='opts'>${q.o.map((o,j)=>`<button class='b2' data-j='${j}'><span class='k'>${'أبجد'[j]}</span>${fx(o)}</button>`).join('')}</div><div class='ex'><b>الشرح:</b> ${fx(q.e)}<div class='rel'>يرتبط بـ: ${q.tg.map(t=>`<button data-tag='${t}'>${CON[t][0]}</button>`).join('')}</div></div></div>`}
function home(){const t=BANK.filter(q=>RES[q.id]===1).length;return `<section class='hero'><h1>أهلاً يا أستاذة هيّا</h1><p>اختر الدرس لتراجعه بالتفصيل: ملخص، أخطاء شائعة، أسئلة برسوم، أسئلة نصية، وروابط بين الدروس. أجبت عن ${t} من ${BANK.length} سؤالاً.</p></section>`+[1,2].map(c=>`<h2 class='ch${c}'>${c==1?'الباب الأول · العناصر الانتقالية':'الباب الثاني · التحليل الكيميائي'}</h2><div class='grid'>${ids(c).map(l=>{const[n,d,k]=cnt(l);return `<a class='lc ch${c}' href='#L-${l}-sum'><b>${l[1]}</b><span>${LN[l]}</span><small>${n-d} سؤال · ${d} رسم</small><i style='width:${k/n*100}%'></i></a>`}).join('')}</div>`).join('')}
function lhead(l,tab){const c=l[0]=='a'?1:2,[n,d,k]=cnt(l);return `<div class='lh ch${c}'><a href='#home'>← الدروس</a><h1>${c==1?'الباب الأول':'الباب الثاني'} · الدرس ${l[1]}: ${LN[l]}</h1><div class='bar'><i style='width:${k/n*100}%'></i></div><small>${k}/${n} سؤال محلول</small><div class='tabs'>${TABS.map(([t,x])=>`<a href='#L-${l}-${t}' class='${t==tab?'on':''}'>${x}${t=='dg'?' ('+d+')':t=='qs'?' ('+(n-d)+')':''}</a>`).join('')}</div></div>`}
function relView(l){const T=U(BANK.filter(q=>q.l==l).flatMap(q=>q.tg));return `<div class='c'><p class='w'>كل مفهوم هنا يظهر في دروس أخرى: افتح الدرس المرتبط أو تدرّب على المفهوم بأسئلة من دروس مختلفة.</p></div>`+T.map(t=>{const o=U(BANK.filter(q=>q.l!=l&&q.tg.includes(t)).map(q=>q.l));return `<div class='c'><h3>${CON[t][0]}</h3><p>${fx(CON[t][1])}</p><p>${o.map(x=>`<a class='chip' href='#L-${x}-sum'>${LN[x]}</a>`).join('')}</p><button data-tag='${t}'>تدرّب على هذا المفهوم</button></div>`}).join('')}
function lesson(l,tab){const c=l[0]=='a'?1:2,i=+l[1]-1,L=ids(c),p=L[i-1],x=L[i+1];let b='';if(tab=='sum')b=`<div class='c'><p>${fx(SUM[c][i][1])}</p></div><div class='c'><h3>تذكّر</h3>${memo(l)}</div>`+STEPS[c].filter((_,k)=>SM[c][k]==l).map(([a,t])=>`<details class='c' open><summary>${a}</summary><ol>${t.split(' · ').map(z=>`<li>${fx(z)}</li>`).join('')}</ol></details>`).join('');else if(tab=='mis')b=MIS[c].filter((_,k)=>MM[c][k]==l).map(([a,w,y])=>`<div class='c'><p class='x'>✗ ${fx(a)}</p><p class='v'>✓ ${fx(w)}</p><p class='w'>${fx(y)}</p></div>`).join('')||'<div class="c">لا أخطاء مسجلة لهذا الدرس.</div>';else if(tab=='dg'||tab=='qs')b=BANK.filter(q=>q.l==l&&!!q.s==(tab=='dg')).map(card).join('');else if(tab=='rl')b=relView(l);return lhead(l,tab)+b+`<div class='pn'>${p?`<a href='#L-${p}-sum'>→ ${LN[p]}</a>`:'<span></span>'}${x?`<a href='#L-${x}-sum'>${LN[x]} ←</a>`:''}</div>`}
function tagPage(t){const all=BANK.filter(q=>q.tg.includes(t)),st=Math.max(1,Math.floor(all.length/12)),L=all.filter((_,i)=>i%st==0).slice(0,12);return `<div class='lh'><a href='#home'>← الدروس</a><h1>${CON[t][0]}</h1><p>${fx(CON[t][1])}</p><small>${L.length} سؤالاً من ${U(L.map(q=>q.l)).length} دروس مختلفة</small></div>`+L.map(card).join('')}
function route(){const h=location.hash.slice(1)||'home',m=h.match(/^L-([ab]\d)-(\w+)$/);let x;if(m){ch=m[1][0]=='a'?1:2;if(m[2]=='tl'){sec='con';TOOL=1;view();TOOL=0;$('#m').insertAdjacentHTML('afterbegin',lhead(m[1],'tl'));scrollTo(0,0);return}x=lesson(m[1],m[2])}else if(h.slice(0,2)=='T-')x=tagPage(h.slice(2));else if(h=='cn')x=cnView();else if(h=='wrong'){const L=BANK.filter(q=>RES[q.id]===0);x=`<div class='lh'><a href='#home'>← الدروس</a><h1>أخطائي (${L.length})</h1></div>`+(L.map(card).join('')||'<div class="c">لا أخطاء بعد.</div>')}else x=home();nav();$('#m').innerHTML=x;scrollTo(0,0)}
function go(){route()}
addEventListener('hashchange',go);go();
</script></body></html>
